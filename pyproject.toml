[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "structure-negative-steering"
version = "0.1.0"
description = "Standalone Boltz-2 negative-steering engine. Run negative steering on arbitrary inputs in isolation, with tests."
requires-python = ">=3.10"

[project.optional-dependencies]
# What the engine and the analyses need on a laptop. boltz and torch are
# GPU/HPC-side and are deliberately absent, because nothing outside a container
# imports them.
experiments = [
    "numpy>=1.24",
    "pandas>=2.0",
    "gemmi>=0.6",
    "biopython>=1.81",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "PyYAML>=6.0",
]
# The same list plus the test tooling, stated once rather than twice. This is
# what CI installs, so a package missing from `experiments` fails on a clean
# runner instead of passing on a laptop whose conda environment supplies it.
test = [
    "structure-negative-steering[experiments]",
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
# The tool interface. Installing this repo puts `negsteer` on PATH, which is
# what lets another pipeline call it the way it calls RFDiffusion.
negsteer = "negsteer.cli:main"

[tool.setuptools]
# Only the CLI package is installed. bin/ stays a directory of standalone
# entry points invoked by path, because that is how the engine has always
# been run and repackaging it would be a rewrite, not a repackaging.
packages = ["negsteer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage runs on every invocation over both trees, so bin/ is visible rather
# than hidden. The gate is a ratchet; see [tool.coverage.report].
addopts = """
    --strict-markers -ra
    --cov=scripts
    --cov=bin
    --cov=negsteer
    --cov-report=lcov:lcov.info
    --cov-report=html
    --cov-report=term-missing:skip-covered
"""
markers = [
    "local_unit: tier - pure helpers on synthetic input. Runs anywhere with Python, under 1s each.",
    "local_integration: tier - reads the committed fixtures and reference structures. Mac, no cluster.",
    "hpc: tier - needs a GPU, the Boltz container, or a finished run. Cluster only.",
    "slow: long-running test.",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# archive/prerepo_scripts/ holds superseded pre-repo scripts, kept verbatim as the
# only record of the sequence-walk and seed-variance diagnostics. Reformatting
# them to satisfy a linter would edit the thing being preserved, and nothing
# imports them, so they are excluded rather than fixed.
exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
# bin/ is linted like the rest of the repo. Its sibling imports follow a
# deliberate sys.path setup, which is marked with noqa: E402 where it occurs.


[tool.coverage.run]
source = ["scripts", "bin", "negsteer"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = true

# A ratchet over bin/ + scripts/ combined. It may only ever go up. Raise it to
# whatever a run reports once new tests land, so coverage cannot quietly fall.
#
# The remaining gap is concentrated in two files. boltz2_iterate_steering.py's
# multi-cycle loop never runs here, because this repo has always driven it at
# --max-cycles 0, and reversion.py's harvest needs real predictions on disk.
# Both are reached by the single-run test in tests/run_single_run_test.slurm.sh,
# which is the hpc tier and cannot run on a laptop or in CI.
fail_under = 69.5
