<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1248" width="1040" height="1248" font-family="Arial, Helvetica, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="1248" fill="#ffffff"/>

  <!-- ─────────────────────────── Legend ─────────────────────────── -->
  <g font-size="13" fill="#333333">
    <rect x="590" y="20" width="390" height="148" fill="#fbfbfb" stroke="#cccccc" stroke-width="1" rx="6"/>
    <text x="604" y="41" font-size="13" font-weight="bold" fill="#111111">Legend</text>
    <rect x="604" y="51" width="15" height="15" fill="#ffffff" stroke="#111111"/>
    <text x="627" y="63">Inputs and final output</text>
    <rect x="604" y="72" width="15" height="15" fill="#e3f0fd" stroke="#3477b5"/>
    <text x="627" y="84">Boltz-2 structure prediction</text>
    <rect x="604" y="93" width="15" height="15" fill="#fff8e1" stroke="#b8860b"/>
    <text x="627" y="105">Decision</text>
    <rect x="604" y="114" width="15" height="15" fill="#eaf5ea" stroke="#4c8c4a"/>
    <text x="627" y="126">Steering mutation selection</text>
    <rect x="604" y="135" width="15" height="15" fill="#f3ecf9" stroke="#7a4fa3"/>
    <text x="627" y="147">Reversion validation</text>
  </g>

  <!-- ─────────────────────────── B1: Inputs ─────────────────────── -->
  <rect x="100" y="20" width="440" height="70" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="320" y="44" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Inputs</text>
  <text x="320" y="70" text-anchor="middle" font-size="14" fill="#111111">Reference complex, YAML config file</text>
  <line x1="320" y1="90" x2="320" y2="110" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ─────────────────── B2: Initial prediction ────────────────── -->
  <rect x="100" y="110" width="440" height="70" rx="8" fill="#e3f0fd" stroke="#3477b5" stroke-width="2"/>
  <text x="320" y="134" text-anchor="middle" font-size="16" font-weight="bold" fill="#12395f">Initial prediction</text>
  <text x="320" y="160" text-anchor="middle" font-size="14" fill="#12395f">Boltz-2, 3 seeds, no MSA</text>
  <line x1="320" y1="180" x2="320" y2="200" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ─────────────────── D1: initial-prediction binder? ─────────────────── -->
  <rect x="100" y="200" width="440" height="60" rx="10" fill="#fff8e1" stroke="#b8860b" stroke-width="2"/>
  <text x="320" y="237" text-anchor="middle" font-size="15" fill="#5a4300">All three seeds correctly posed and not misfolded?</text>
  <line x1="540" y1="230" x2="588" y2="230" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="564" y="221" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">Yes</text>

  <rect x="590" y="200" width="390" height="60" rx="8" fill="#fff8e1" stroke="#b8860b" stroke-width="2"/>
  <text x="785" y="237" text-anchor="middle" font-size="15" font-weight="bold" fill="#5a4300">Steering skipped, initial prediction reported</text>
  <line x1="320" y1="260" x2="320" y2="286" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="332" y="278" font-size="14" font-weight="bold" fill="#000000">No</text>

  <!-- ──────────────── B3: competing and target interface ───────────────── -->
  <rect x="100" y="286" width="440" height="70" rx="8" fill="#eaf5ea" stroke="#4c8c4a" stroke-width="2"/>
  <text x="320" y="310" text-anchor="middle" font-size="16" font-weight="bold" fill="#284d27">Competing and target interface</text>
  <text x="320" y="336" text-anchor="middle" font-size="14" fill="#284d27">Receptor residues within 5 &#197; of the effector</text>
  <line x1="320" y1="356" x2="320" y2="376" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ───────────────────── B4: candidate pool ───────────────────── -->
  <rect x="100" y="376" width="440" height="70" rx="8" fill="#eaf5ea" stroke="#4c8c4a" stroke-width="2"/>
  <text x="320" y="400" text-anchor="middle" font-size="16" font-weight="bold" fill="#284d27">Candidate pool</text>
  <text x="320" y="426" text-anchor="middle" font-size="14" fill="#284d27">Outside target interface, outward-facing, top 12 kept</text>
  <line x1="320" y1="446" x2="320" y2="466" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ──────────────── B5: steered sequence generation ──────────────── -->
  <rect x="116" y="466" width="440" height="70" rx="8" fill="#eaf5ea" stroke="#4c8c4a" stroke-width="2"/>
  <rect x="108" y="466" width="440" height="70" rx="8" fill="#eaf5ea" stroke="#4c8c4a" stroke-width="2"/>
  <rect x="100" y="466" width="440" height="70" rx="8" fill="#eaf5ea" stroke="#4c8c4a" stroke-width="2"/>
  <text x="320" y="490" text-anchor="middle" font-size="16" font-weight="bold" fill="#284d27">Steered sequence generation</text>
  <text x="320" y="516" text-anchor="middle" font-size="14" fill="#284d27">N sequences, 6 positions (3 if interfaces overlap by half)</text>
  <line x1="320" y1="536" x2="320" y2="556" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ─────────────────── B6: steered prediction ─────────────────── -->
  <rect x="116" y="556" width="440" height="50" rx="8" fill="#e3f0fd" stroke="#3477b5" stroke-width="2"/>
  <rect x="108" y="556" width="440" height="50" rx="8" fill="#e3f0fd" stroke="#3477b5" stroke-width="2"/>
  <rect x="100" y="556" width="440" height="50" rx="8" fill="#e3f0fd" stroke="#3477b5" stroke-width="2"/>
  <text x="320" y="587" text-anchor="middle" font-size="15" font-weight="bold" fill="#12395f">Boltz-2 prediction of steered sequences</text>
  <line x1="320" y1="606" x2="320" y2="626" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ────────────────── D2: correctly posed, not misfolded? ─────────────────── -->
  <rect x="100" y="626" width="440" height="60" rx="10" fill="#fff8e1" stroke="#b8860b" stroke-width="2"/>
  <text x="320" y="663" text-anchor="middle" font-size="15" fill="#5a4300">Not misfolded and effector correctly posed within 5 &#197;?</text>
  <line x1="540" y1="656" x2="588" y2="656" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="564" y="647" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">No</text>

  <rect x="590" y="626" width="390" height="60" rx="8" fill="#fff8e1" stroke="#b8860b" stroke-width="2"/>
  <text x="785" y="663" text-anchor="middle" font-size="15" font-weight="bold" fill="#5a4300">Failed</text>
  <line x1="980" y1="656" x2="1010" y2="656" stroke="#333333" stroke-width="2"/>
  <line x1="320" y1="686" x2="320" y2="712" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="332" y="704" font-size="14" font-weight="bold" fill="#000000">Yes</text>

  <!-- ─────────────────── B9: contamination check ────────────────── -->
  <rect x="116" y="712" width="440" height="70" rx="8" fill="#f3ecf9" stroke="#7a4fa3" stroke-width="2"/>
  <rect x="108" y="712" width="440" height="70" rx="8" fill="#f3ecf9" stroke="#7a4fa3" stroke-width="2"/>
  <rect x="100" y="712" width="440" height="70" rx="8" fill="#f3ecf9" stroke="#7a4fa3" stroke-width="2"/>
  <text x="320" y="736" text-anchor="middle" font-size="16" font-weight="bold" fill="#3f2260">Contamination check</text>
  <text x="320" y="762" text-anchor="middle" font-size="14" fill="#3f2260">Mutation contacting the effector, at any position</text>
  <line x1="320" y1="782" x2="320" y2="802" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ───────────────── D3: majority contaminated? ───────────────── -->
  <rect x="100" y="802" width="440" height="60" rx="10" fill="#fff8e1" stroke="#b8860b" stroke-width="2"/>
  <text x="320" y="839" text-anchor="middle" font-size="15" fill="#5a4300">At least half the correctly posed seeds contaminated?</text>
  <line x1="540" y1="832" x2="588" y2="832" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="564" y="823" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">No</text>

  <rect x="590" y="802" width="390" height="60" rx="8" fill="#fff8e1" stroke="#b8860b" stroke-width="2"/>
  <text x="785" y="839" text-anchor="middle" font-size="15" font-weight="bold" fill="#5a4300">Steered result stands</text>
  <line x1="980" y1="832" x2="1010" y2="832" stroke="#333333" stroke-width="2"/>
  <line x1="1010" y1="656" x2="1010" y2="822" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1010" y1="832" x2="1010" y2="1128" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="862" x2="320" y2="888" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="332" y="880" font-size="14" font-weight="bold" fill="#000000">Yes</text>

  <!-- ────────────────────── B10: reverted sequence generation ──────────────────────── -->
  <rect x="116" y="888" width="440" height="70" rx="8" fill="#f3ecf9" stroke="#7a4fa3" stroke-width="2"/>
  <rect x="108" y="888" width="440" height="70" rx="8" fill="#f3ecf9" stroke="#7a4fa3" stroke-width="2"/>
  <rect x="100" y="888" width="440" height="70" rx="8" fill="#f3ecf9" stroke="#7a4fa3" stroke-width="2"/>
  <text x="320" y="912" text-anchor="middle" font-size="16" font-weight="bold" fill="#3f2260">Reverted sequence generation</text>
  <text x="320" y="938" text-anchor="middle" font-size="14" fill="#3f2260">Reset contaminating positions to reference</text>
  <line x1="320" y1="958" x2="320" y2="978" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ─────────────────── B10b: reverted prediction ─────────────────── -->
  <rect x="116" y="978" width="440" height="50" rx="8" fill="#e3f0fd" stroke="#3477b5" stroke-width="2"/>
  <rect x="108" y="978" width="440" height="50" rx="8" fill="#e3f0fd" stroke="#3477b5" stroke-width="2"/>
  <rect x="100" y="978" width="440" height="50" rx="8" fill="#e3f0fd" stroke="#3477b5" stroke-width="2"/>
  <text x="320" y="1009" text-anchor="middle" font-size="15" font-weight="bold" fill="#12395f">Boltz-2 prediction of reverted sequences</text>
  <!-- Fan out to the three verdicts -->
  <line x1="320" y1="1028" x2="320" y2="1048" stroke="#333333" stroke-width="2"/>
  <line x1="240" y1="1048" x2="840" y2="1048" stroke="#333333" stroke-width="2"/>
  <line x1="240" y1="1048" x2="240" y2="1068" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="1048" x2="540" y2="1068" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="1048" x2="840" y2="1068" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="118" y="1068" width="260" height="50" rx="8" fill="#f3ecf9" stroke="#7a4fa3" stroke-width="2"/>
  <rect x="114" y="1068" width="260" height="50" rx="8" fill="#f3ecf9" stroke="#7a4fa3" stroke-width="2"/>
  <rect x="110" y="1068" width="260" height="50" rx="8" fill="#f3ecf9" stroke="#7a4fa3" stroke-width="2"/>
  <text x="240" y="1099" text-anchor="middle" font-size="15" font-weight="bold" fill="#3f2260">Pose holds</text>
  <rect x="418" y="1068" width="260" height="50" rx="8" fill="#f3ecf9" stroke="#7a4fa3" stroke-width="2"/>
  <rect x="414" y="1068" width="260" height="50" rx="8" fill="#f3ecf9" stroke="#7a4fa3" stroke-width="2"/>
  <rect x="410" y="1068" width="260" height="50" rx="8" fill="#f3ecf9" stroke="#7a4fa3" stroke-width="2"/>
  <text x="540" y="1099" text-anchor="middle" font-size="15" font-weight="bold" fill="#3f2260">Pose collapses</text>
  <rect x="718" y="1068" width="260" height="50" rx="8" fill="#f3ecf9" stroke="#7a4fa3" stroke-width="2"/>
  <rect x="714" y="1068" width="260" height="50" rx="8" fill="#f3ecf9" stroke="#7a4fa3" stroke-width="2"/>
  <rect x="710" y="1068" width="260" height="50" rx="8" fill="#f3ecf9" stroke="#7a4fa3" stroke-width="2"/>
  <text x="840" y="1099" text-anchor="middle" font-size="15" font-weight="bold" fill="#3f2260">New contamination</text>
  <!-- Merge into the final output -->
  <line x1="240" y1="1118" x2="240" y2="1138" stroke="#333333" stroke-width="2"/>
  <line x1="540" y1="1118" x2="540" y2="1138" stroke="#333333" stroke-width="2"/>
  <line x1="840" y1="1118" x2="840" y2="1138" stroke="#333333" stroke-width="2"/>
  <line x1="240" y1="1138" x2="1010" y2="1138" stroke="#333333" stroke-width="2"/>
  <line x1="540" y1="1138" x2="540" y2="1158" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ─────────────────── B11: aggregation output ────────────────── -->
  <rect x="290" y="1158" width="500" height="70" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="540" y="1182" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Aggregation and ranking</text>
  <text x="540" y="1208" text-anchor="middle" font-size="14" fill="#111111">Tiered by successful seeds, ranked by tier and pose</text>
</svg>
