<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1780" width="1000" height="1780" font-family="Arial, Helvetica, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1780" fill="#ffffff"/>

  <!-- ─────────────────────────── Legend ─────────────────────────── -->
  <g font-size="12" fill="#333333">
    <rect x="590" y="18" width="390" height="128" fill="#fbfbfb" stroke="#cccccc" stroke-width="1" rx="6"/>
    <text x="604" y="38" font-size="12" font-weight="bold" fill="#111111">Legend</text>
    <rect x="604" y="47" width="14" height="14" fill="#ffffff" stroke="#111111"/>
    <text x="626" y="58">Inputs and final output</text>
    <rect x="604" y="67" width="14" height="14" fill="#e3f0fd" stroke="#3477b5"/>
    <text x="626" y="78">Boltz-2 structure prediction</text>
    <rect x="604" y="87" width="14" height="14" fill="#fff8e1" stroke="#b8860b"/>
    <text x="626" y="98">Decision</text>
    <rect x="604" y="107" width="14" height="14" fill="#eaf5ea" stroke="#4c8c4a"/>
    <text x="626" y="118">Steering mutation selection</text>
    <rect x="604" y="127" width="14" height="14" fill="#f3ecf9" stroke="#7a4fa3"/>
    <text x="626" y="138">Reversion validation</text>
  </g>

  <!-- ─────────────────────────── B1: Inputs ─────────────────────── -->
  <rect x="100" y="20" width="440" height="118" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="320" y="45" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Inputs</text>
  <text x="320" y="80.5" text-anchor="middle" font-size="13" fill="#111111">Ground-truth receptor&#8211;effector complex</text>
  <text x="320" y="98.5" text-anchor="middle" font-size="13" fill="#111111">Receptor and effector sequences</text>
  <text x="320" y="116.5" text-anchor="middle" font-size="13" fill="#111111">True-interface and design-region residues</text>
  <line x1="320" y1="138" x2="320" y2="168" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ─────────────────────── B2: Cold start ─────────────────────── -->
  <rect x="100" y="170" width="440" height="76" rx="8" fill="#e3f0fd" stroke="#3477b5" stroke-width="2"/>
  <text x="320" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#12395f">Cold-start prediction</text>
  <text x="320" y="227.5" text-anchor="middle" font-size="13" fill="#12395f">Boltz-2 across S seeds, effector pinned as a template</text>
  <line x1="320" y1="246" x2="320" y2="276" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ─────────────────────── B3: Pose metrics ───────────────────── -->
  <rect x="100" y="278" width="440" height="76" rx="8" fill="#e3f0fd" stroke="#3477b5" stroke-width="2"/>
  <text x="320" y="303" text-anchor="middle" font-size="14" font-weight="bold" fill="#12395f">Per-seed pose metrics</text>
  <text x="320" y="335.5" text-anchor="middle" font-size="13" fill="#12395f">receptor-aligned effector RMSD (ra_eff), plus chain-integrity checks</text>
  <line x1="320" y1="354" x2="320" y2="384" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ─────────────────── D1: cold-start binder? ─────────────────── -->
  <rect x="100" y="386" width="440" height="70" rx="10" fill="#fff8e1" stroke="#b8860b" stroke-width="2"/>
  <text x="320" y="425" text-anchor="middle" font-size="14" fill="#5a4300">All seeds within 5 &#197; ra_eff and chains intact?</text>
  <line x1="540" y1="421" x2="588" y2="421" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="548" y="412" font-size="14" font-weight="bold" fill="#000000">yes</text>

  <rect x="590" y="386" width="390" height="70" rx="8" fill="#fff8e1" stroke="#b8860b" stroke-width="3"/>
  <text x="785" y="411" text-anchor="middle" font-size="14" font-weight="bold" fill="#5a4300">Cold-start binder</text>
  <text x="785" y="440.5" text-anchor="middle" font-size="12" fill="#5a4300">steering skipped, cold-start seeds reported as-is</text>
  <line x1="320" y1="456" x2="320" y2="486" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="332" y="477" font-size="14" font-weight="bold" fill="#000000">no</text>

  <!-- ─────────────────── B4: spurious interface ─────────────────── -->
  <rect x="100" y="488" width="440" height="76" rx="8" fill="#eaf5ea" stroke="#4c8c4a" stroke-width="2"/>
  <text x="320" y="513" text-anchor="middle" font-size="14" font-weight="bold" fill="#284d27">Spurious interface</text>
  <text x="320" y="537.5" text-anchor="middle" font-size="13" fill="#284d27">receptor residues with a heavy atom within 5 &#197; of the effector</text>
  <text x="320" y="555.5" text-anchor="middle" font-size="13" fill="#284d27">in the cold-start pose</text>
  <line x1="320" y1="564" x2="320" y2="594" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ───────────────────── B5: protected set ────────────────────── -->
  <rect x="100" y="596" width="440" height="76" rx="8" fill="#eaf5ea" stroke="#4c8c4a" stroke-width="2"/>
  <text x="320" y="621" text-anchor="middle" font-size="14" font-weight="bold" fill="#284d27">Protected set</text>
  <text x="320" y="645.5" text-anchor="middle" font-size="13" fill="#284d27">the true interface, never mutated, plus the de novo design</text>
  <text x="320" y="663.5" text-anchor="middle" font-size="13" fill="#284d27">region where one is defined. These targets have none</text>
  <line x1="320" y1="672" x2="320" y2="702" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ───────────────────── B6: candidate pool ───────────────────── -->
  <rect x="100" y="704" width="440" height="94" rx="8" fill="#eaf5ea" stroke="#4c8c4a" stroke-width="2"/>
  <text x="320" y="729" text-anchor="middle" font-size="14" font-weight="bold" fill="#284d27">Candidate pool</text>
  <text x="320" y="761.5" text-anchor="middle" font-size="13" fill="#284d27">spurious-interface residues, less the protected set and those with no</text>
  <text x="320" y="779.5" text-anchor="middle" font-size="13" fill="#284d27">outward-pointing side chain, ranked by contact distance, top P kept</text>
  <!-- Side note: fallback behaviour -->
  <line x1="540" y1="751" x2="588" y2="751" stroke="#777777" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="590" y="656" width="390" height="172" rx="8" fill="#fbfbfb" stroke="#999999" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="785" y="681" text-anchor="middle" font-size="13" font-weight="bold" fill="#444444">When the cold start is already close</text>
  <text x="785" y="708.5" text-anchor="middle" font-size="12" fill="#444444">More than half the spurious interface lying inside the true</text>
  <text x="785" y="726.5" text-anchor="middle" font-size="12" fill="#444444">interface halves the per-sequence mutation count. A pool smaller</text>
  <text x="785" y="744.5" text-anchor="middle" font-size="12" fill="#444444">than that count caps it. An empty pool falls back to a second</text>
  <text x="785" y="762.5" text-anchor="middle" font-size="12" fill="#444444">shell, C&#945; within 6 &#197; of the effector, less the spurious interface</text>
  <text x="785" y="780.5" text-anchor="middle" font-size="12" fill="#444444">and the protected set. Fewer than three candidates leaves the</text>
  <text x="785" y="798.5" text-anchor="middle" font-size="12" fill="#444444">wild type re-sampled at that overlap, or steering skipped</text>
  <line x1="320" y1="798" x2="320" y2="828" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ──────────────────── B7: design generation ─────────────────── -->
  <rect x="100" y="830" width="440" height="94" rx="8" fill="#eaf5ea" stroke="#4c8c4a" stroke-width="2"/>
  <text x="320" y="855" text-anchor="middle" font-size="14" font-weight="bold" fill="#284d27">Steered design generation</text>
  <text x="320" y="887.5" text-anchor="middle" font-size="13" fill="#284d27">N designs, each mutating M sampled pool positions under the</text>
  <text x="320" y="905.5" text-anchor="middle" font-size="13" fill="#284d27">steering mode (strong, mild, conservative or alanine)</text>
  <line x1="320" y1="924" x2="320" y2="954" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ─────────────────── B8: predict steered ────────────────────── -->
  <rect x="100" y="956" width="440" height="58" rx="8" fill="#e3f0fd" stroke="#3477b5" stroke-width="2"/>
  <text x="320" y="989" text-anchor="middle" font-size="13" fill="#12395f">Boltz-2 prediction of every steered design across S seeds</text>
  <line x1="320" y1="1014" x2="320" y2="1044" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ────────────────── D2: intact and rescued? ─────────────────── -->
  <rect x="100" y="1046" width="440" height="78" rx="10" fill="#fff8e1" stroke="#b8860b" stroke-width="2"/>
  <text x="320" y="1089" text-anchor="middle" font-size="14" fill="#5a4300">Chains intact and effector rescued to within 5 &#197;?</text>
  <line x1="540" y1="1085" x2="588" y2="1085" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="548" y="1076" font-size="14" font-weight="bold" fill="#000000">no</text>

  <rect x="590" y="1046" width="390" height="78" rx="8" fill="#fff8e1" stroke="#b8860b" stroke-width="3"/>
  <text x="785" y="1071" text-anchor="middle" font-size="14" font-weight="bold" fill="#5a4300">Not carried forward</text>
  <text x="785" y="1104.5" text-anchor="middle" font-size="12" fill="#5a4300">recorded as a failing seed</text>
  <line x1="320" y1="1124" x2="320" y2="1154" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="332" y="1145" font-size="14" font-weight="bold" fill="#000000">yes</text>

  <!-- ─────────────────── B9: contamination check ────────────────── -->
  <rect x="100" y="1156" width="440" height="76" rx="8" fill="#f3ecf9" stroke="#7a4fa3" stroke-width="2"/>
  <text x="320" y="1181" text-anchor="middle" font-size="14" font-weight="bold" fill="#3f2260">Contamination check</text>
  <text x="320" y="1205.5" text-anchor="middle" font-size="13" fill="#3f2260">steering mutations that themselves contact the effector, counted</text>
  <text x="320" y="1223.5" text-anchor="middle" font-size="13" fill="#3f2260">over the effector residues that sit at its true interface</text>
  <line x1="320" y1="1232" x2="320" y2="1262" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ───────────────── D3: majority contaminated? ───────────────── -->
  <rect x="100" y="1264" width="440" height="76" rx="10" fill="#fff8e1" stroke="#b8860b" stroke-width="2"/>
  <text x="320" y="1306" text-anchor="middle" font-size="14" fill="#5a4300">At least half of a design&#8217;s rescued seeds contaminated?</text>
  <line x1="540" y1="1302" x2="588" y2="1302" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="548" y="1293" font-size="14" font-weight="bold" fill="#000000">no</text>

  <rect x="590" y="1264" width="390" height="76" rx="8" fill="#fff8e1" stroke="#b8860b" stroke-width="3"/>
  <text x="785" y="1289" text-anchor="middle" font-size="14" font-weight="bold" fill="#5a4300">Steered result stands</text>
  <text x="785" y="1321.5" text-anchor="middle" font-size="12" fill="#5a4300">no reversion attempted</text>
  <line x1="320" y1="1340" x2="320" y2="1370" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="332" y="1361" font-size="14" font-weight="bold" fill="#000000">yes</text>

  <!-- ────────────────────── B10: reversion ──────────────────────── -->
  <rect x="100" y="1372" width="440" height="94" rx="8" fill="#f3ecf9" stroke="#7a4fa3" stroke-width="2"/>
  <text x="320" y="1397" text-anchor="middle" font-size="14" font-weight="bold" fill="#3f2260">Reversion</text>
  <text x="320" y="1429.5" text-anchor="middle" font-size="13" fill="#3f2260">contaminating mutations reset to wild type, all others kept,</text>
  <text x="320" y="1447.5" text-anchor="middle" font-size="13" fill="#3f2260">and the sequence re-predicted</text>
  <!-- Fan out to the three verdicts -->
  <line x1="320" y1="1466" x2="320" y2="1490" stroke="#333333" stroke-width="2"/>
  <line x1="240" y1="1490" x2="840" y2="1490" stroke="#333333" stroke-width="2"/>
  <line x1="240" y1="1490" x2="240" y2="1512" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="1490" x2="540" y2="1512" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="1490" x2="840" y2="1512" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="110" y="1514" width="260" height="88" rx="8" fill="#f3ecf9" stroke="#7a4fa3" stroke-width="3"/>
  <text x="240" y="1539" text-anchor="middle" font-size="14" font-weight="bold" fill="#3f2260">Pose holds</text>
  <text x="240" y="1568.5" text-anchor="middle" font-size="12" fill="#3f2260">reverted pose intact and</text>
  <text x="240" y="1586.5" text-anchor="middle" font-size="12" fill="#3f2260">within 5 &#197;, so it passes</text>
  <rect x="410" y="1514" width="260" height="88" rx="8" fill="#f3ecf9" stroke="#7a4fa3" stroke-width="2"/>
  <text x="540" y="1539" text-anchor="middle" font-size="14" font-weight="bold" fill="#3f2260">Pose collapses</text>
  <text x="540" y="1568.5" text-anchor="middle" font-size="12" fill="#3f2260">reverted pose not intact,</text>
  <text x="540" y="1586.5" text-anchor="middle" font-size="12" fill="#3f2260">or outside the 5 &#197; cutoff</text>
  <rect x="710" y="1514" width="260" height="88" rx="8" fill="#f3ecf9" stroke="#7a4fa3" stroke-width="2"/>
  <text x="840" y="1539" text-anchor="middle" font-size="14" font-weight="bold" fill="#3f2260">New contamination</text>
  <text x="840" y="1568.5" text-anchor="middle" font-size="12" fill="#3f2260">a surviving mutation contacts</text>
  <text x="840" y="1586.5" text-anchor="middle" font-size="12" fill="#3f2260">the effector at a protected position</text>
  <!-- Merge into the final output -->
  <line x1="240" y1="1602" x2="240" y2="1626" stroke="#333333" stroke-width="2"/>
  <line x1="540" y1="1602" x2="540" y2="1626" stroke="#333333" stroke-width="2"/>
  <line x1="840" y1="1602" x2="840" y2="1626" stroke="#333333" stroke-width="2"/>
  <line x1="240" y1="1626" x2="840" y2="1626" stroke="#333333" stroke-width="2"/>
  <line x1="540" y1="1626" x2="540" y2="1652" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ─────────────────── B11: aggregation output ────────────────── -->
  <rect x="290" y="1654" width="500" height="98" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="540" y="1679" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Aggregation and tiering</text>
  <text x="540" y="1713.5" text-anchor="middle" font-size="13" fill="#111111">seeds pooled per sequence and tiered A (all), B (some), C (one)</text>
  <text x="540" y="1731.5" text-anchor="middle" font-size="13" fill="#111111">or none. One representative enters the ranked table</text>
</svg>
