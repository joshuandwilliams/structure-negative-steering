name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # The `test` extra is the whole dependency list for the two local tiers.
      # It carries numpy, pandas, matplotlib, scipy, gemmi and biopython, which
      # a laptop's conda environment supplies for free. A runner does not, so
      # anything missing from that extra fails here rather than silently
      # passing locally.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      # The hpc tier needs a GPU, the Boltz container or a finished run, so only
      # the two local tiers run here. Coverage over bin/ and scripts/ is gated
      # by pyproject as a ratchet, and pytest applies it through addopts.
      #
      # Three tests skip here and that is expected. addopts carries -ra, so the
      # reasons are printed in the log rather than being asserted on.
      - name: Run the local test tiers
        run: pytest -m "local_unit or local_integration"

  # The workflow is not runnable in CI: every stage shells out to singularity,
  # and the GPU stages need Boltz. -stub-run replaces each script with its stub,
  # so this checks the thing CI actually can check, which is that the DAG wires
  # up and both fan-outs and both bypass branches resolve.
  workflow:
    runs-on: ubuntu-latest
    # Job-wide, so the launcher cannot quietly resolve to a newer Nextflow on
    # any step. This is the version containers/NextFlow.def bakes in and the
    # cluster therefore runs.
    env:
      NXF_VER: 25.10.4
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # Nextflow needs a JDK, and the runner already ships several. Using the
      # preinstalled one instead of actions/setup-java removes a download that
      # has already failed this job once with a 429, for a dependency that was
      # sitting on the machine the whole time.
      - name: Use the runner's preinstalled JDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

      # READ_CONFIG has no stub. It runs the real driver, because the point of
      # the stub run is to check that the config the workflow reads produces
      # the channel the rest of the DAG expects. That needs PyYAML.
      - name: Install the config driver's dependencies
        run: pip install -e .[test]

      # Pinned to the version the cluster runs, which is the version
      # containers/NextFlow.def bakes in. CI on a newer Nextflow is CI that
      # cannot see the config bug that took a run down: 25.10 replaces a
      # `withLabel:` block when a profile redefines it, 26.04 merges.
      - name: Install Nextflow, pinned to the cluster's version
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      # The stub run below exercises the DAG, not the cluster directives, so
      # assert those directly. A gpu stage that loses its queue or its --gres
      # gets scheduled on whatever partition SLURM likes, with no GPU.
      - name: Assert the cluster profile keeps its resources
        run: |
          nextflow config -profile hpc > resolved.config
          grep -q "queue = 'jic-gpu'"                  resolved.config
          grep -q "clusterOptions = '--gres=gpu:1'"    resolved.config
          grep -q "queue = 'jic-short'"                resolved.config
          echo "cluster directives survive profile resolution"

      - name: Stub-run the workflow
        # --allow_host_python because a runner has no Boltz image. READ_CONFIG
        # has no stub, so it runs the real driver against pip-installed PyYAML.
        # Nothing else in the workflow may take that path.
        run: |
          nextflow run main.nf --targets tests/single_run_test/config.yml \
            -stub-run -profile local --allow_host_python
