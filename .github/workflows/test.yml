name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # The `test` extra is the whole dependency list for the logic tier. It
      # carries numpy, gemmi, biopython and PyYAML, plus pytest and pytest-cov.
      # The analysis stack, pandas, matplotlib and scipy, is deliberately NOT
      # here: it moved to negative-steering-analyses with the analyses. A
      # laptop's conda environment supplies packages for free and a runner does
      # not, so anything missing from that extra fails here rather than
      # silently passing locally.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      # Only the logic tier runs here. check_test_run needs a finished run on
      # the cluster, and there is no `hpc` tier: that one asserted on the
      # benchmark tree, which moved to negative-steering-analyses. Coverage
      # over bin/ and negsteer/ is gated by pyproject as a ratchet, and pytest
      # applies it through addopts.
      #
      # One test skips here and that is expected, the gated host-python
      # exception in test_no_host_python.py, which has its own test. addopts
      # carries -ra, so the reason is printed in the log.
      - name: Run the logic tier
        run: pytest -m logic --cov-report=xml

      # Skipped until the CODECOV_TOKEN secret is added to the repository.
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage.xml

  # The workflow is not runnable in CI: every stage shells out to singularity,
  # and the GPU stages need Boltz. -stub-run replaces each script with its stub,
  # so this checks the thing CI actually can check, which is that the DAG wires
  # up and both fan-outs and both bypass branches resolve.
  workflow:
    runs-on: ubuntu-latest
    # Job-wide, so the launcher cannot quietly resolve to a newer Nextflow on
    # any step. This is the version the cluster runs, baked into NextFlow.def
    # in receptor-resurfacing-pipeline, which is where that image is built.
    env:
      NXF_VER: 25.10.4
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # Nextflow needs a JDK, and the runner already ships several. Using the
      # preinstalled one instead of actions/setup-java removes a download that
      # has already failed this job once with a 429, for a dependency that was
      # sitting on the machine the whole time.
      - name: Use the runner's preinstalled JDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

      # READ_CONFIG has no stub. It runs the real driver, because the point of
      # the stub run is to check that the config the workflow reads produces
      # the channel the rest of the DAG expects. That needs PyYAML.
      - name: Install the config driver's dependencies
        run: pip install -e .[test]

      # Pinned to the version the cluster runs, from the same image def as
      # above. CI on a newer Nextflow is CI that
      # cannot see the config bug that took a run down: 25.10 replaces a
      # `withLabel:` block when a profile redefines it, 26.04 merges.
      - name: Install Nextflow, pinned to the cluster's version
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      # The stub run below exercises the DAG, not the cluster directives, so
      # assert those directly. A gpu stage that loses its queue or its --gres
      # gets scheduled on whatever partition SLURM likes, with no GPU.
      #
      # Partition names are site-specific, so this feeds the resolver the same
      # environment variables site.conf would and checks they arrive. A fork
      # with different partition names passes unchanged, which the old version
      # asserting the literal 'jic-gpu' did not.
      - name: Assert the cluster profile keeps its resources
        env:
          NEGSTEER_PARTITION_GPU: ci-gpu
          NEGSTEER_PARTITION_CPU: ci-cpu
          NEGSTEER_GPU_CLUSTER_OPTIONS: --gres=gpu:1
          NEGSTEER_MAX_GPU_JOBS: 4
        run: |
          nextflow config -profile hpc > resolved.config
          grep -q "queue = 'ci-gpu'"                   resolved.config
          grep -q "queue = 'ci-cpu'"                   resolved.config
          grep -q "clusterOptions = '--gres=gpu:1'"    resolved.config
          grep -q "maxForks = 4"                       resolved.config
          echo "cluster directives survive profile resolution"

      # And with nothing set, which is what a fresh clone has. A null queue
      # makes Nextflow omit -p rather than submit `-p null`.
      - name: Assert the profile resolves with no site settings
        run: |
          nextflow config -profile hpc > bare.config
          grep -q "queue = null"                       bare.config
          grep -q "clusterOptions = '--gres=gpu:1'"    bare.config
          echo "resolves with no site.conf"

      - name: Stub-run the workflow
        # --allow_host_python because a runner has no Boltz image. READ_CONFIG
        # has no stub, so it runs the real driver against pip-installed PyYAML.
        # Nothing else in the workflow may take that path.
        run: |
          nextflow run main.nf --targets tests/test_run/config.yml \
            -stub-run -profile local --allow_host_python
