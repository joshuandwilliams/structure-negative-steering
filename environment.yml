# Conda environment for what this repo does on a laptop: the config driver,
# input preparation, the two local test tiers, and linting.
#
# It contains NO structure predictor and no GPU stack. Boltz-2 and its CUDA
# dependencies live in the Singularity image built from
# containers/boltz2_negsteer.def, on the cluster. Nothing here can run a
# prediction, by design.
#
#   mamba env create -f environment.yml
#   mamba activate negsteer-dev
#   pytest -m logic
#
# The analyses and their plotting stack live in negative-steering-analyses,
# which has its own environment.
#
# Import names that differ from the distribution name, so a missing one is not
# obvious from the traceback:
#   biopython -> Bio        pyyaml -> yaml        gemmi -> gemmi
name: negsteer-dev

channels:
  - conda-forge
  - bioconda

dependencies:
  # ----- interpreter -----
  # bin/ uses `X | None` annotations, so 3.10 is the floor.
  - python=3.11.15

  - numpy=2.4.6

  # ----- structure parsing, used by bin/prepare_complex_inputs.py -----
  # The engine takes gemmi OR biopython. Both are pinned so the derived
  # interface indices are reproducible rather than parser-dependent.
  - gemmi=0.7.5
  - biopython=1.87

  # ----- config parsing, used by bin/negative_steering.py -----
  - pyyaml=6.0.3

  # ----- tests and lint -----
  - pytest=9.1.1
  - pytest-cov=7.1.0
  - ruff=0.15.21              # pin, or CI fails on rules a newer release adds

  # tests/characterization/test_run_one_shell.py runs
  # bin/negative_steering_run_one.sh directly. That script expands empty arrays
  # under `set -u`, which is an error in bash 3.2 — still the system bash on
  # macOS. Supplying bash here keeps the environment self-contained rather than
  # depending on a Homebrew install. Linux and CI are already on 5.x, so the
  # test finds one there without this. Absent either, those tests skip with an
  # explicit reason rather than passing silently.
  - bash=5.2.37
